<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crediário</title>
<meta name="theme-color" content="#F6F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crediário">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA; --card:#FFFFFF; --ink:#2B2420; --muted:#857A70; --line:#E8DFD4;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E2EDE8;
  --late:#B24E26; --late-soft:#F8E5DA; --warn:#9A6B00; --warn-soft:#F7EDD2;
  --ok:#2F7A52; --ok-soft:#DFF0E6; --wa:#1FA855;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:26px 4px 10px}
.sub{color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);flex:none}
.top .grow{flex:1;min-width:0}
.top .iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line);flex:none}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;margin-top:2px;white-space:nowrap}
.stat.late .v{color:var(--late)}
.stat .s{font-size:13px;color:var(--muted);margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;text-align:left}
.row-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.row-main small.late{color:var(--late)}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.amt small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.ic{width:20px;height:20px;flex:none}
.mini{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.mini.wa{background:#E3F5EA;color:var(--wa)}
.mini.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;white-space:nowrap}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.mut{background:#EFEAE3;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.in{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:1.45}
.in.big{height:60px;font-size:26px;font-weight:600;font-family:Fraunces,Georgia,serif}
.lbl{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:14px 2px 6px}
.search{position:relative;margin-top:14px}
.search .in{padding-left:42px}
.search svg{position:absolute;left:13px;top:14px;color:var(--muted)}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.banner{border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.banner.warn{background:var(--warn-soft);color:#6B4B00}
.banner.late{background:var(--late-soft);color:#7A2F12}
.banner.info{background:var(--accent-soft);color:#1E4238}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.nota{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.nota-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nota-h b{font-weight:600}
.itens{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);font-size:14.5px}
.itens div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.itens span:first-child{color:#5a4f47}
.parc{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.parc .p{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:14.5px}
.nota-a{display:flex;gap:8px;margin-top:12px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.saldo-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav.tabs .in-nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;font-weight:500}
.tab.on{color:var(--accent)}
.tab .plus{width:52px;height:52px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(47,93,80,.35);margin-top:-18px}
/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
#sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(30,22,16,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.sheet-h b{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600}
.sheet-h button{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.sheet-b{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.item-row{display:grid;grid-template-columns:52px 1fr 104px 32px;gap:6px;margin-bottom:6px;align-items:center}
.item-row .in{height:44px;padding:0 10px}
.item-row .rm{width:32px;height:44px;display:grid;place-items:center;color:var(--muted)}
.parc-row{display:grid;grid-template-columns:28px 1fr 120px;gap:8px;align-items:center;margin-bottom:6px}
.parc-row .n{font-size:13px;color:var(--muted);text-align:center}
.parc-row .in{height:44px;padding:0 10px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;height:48px}
.stepper button{width:48px;height:48px;font-size:22px;font-weight:500}
.stepper span{flex:1;text-align:center;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.total-line b{font-family:Fraunces,Georgia,serif;font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EAE3D9;border-radius:12px;padding:3px;gap:3px}
.seg button{height:42px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.picked{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:4px}
.picked .lbl{margin:0 0 2px}
.link{color:var(--accent);font-weight:600;font-size:14.5px}
.pk-item{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px}
.pk-item.novo{color:var(--accent);font-weight:600;border-style:dashed}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.toggle small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:999px;background:#D9D0C5;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:22px}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:#fff}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:#FBF8F4;border-top:1px solid var(--line);font-weight:600}
.grp-h:first-child{border-top:0}
.grp-h small{color:var(--muted);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;text-align:left}
.menu-btn .mini{width:46px;height:46px;border-radius:14px}
.menu-btn b{display:block;font-size:17px}
.menu-btn small{color:var(--muted)}
.muted{color:var(--muted)}
.right{text-align:right}
.mt{margin-top:12px}
.hidden{display:none!important}
.bank-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin:0 6px 8px 0;font-size:14.5px}
.bank-chip button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--muted);text-align:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.logo-big{width:72px;height:72px;border-radius:20px;background:var(--accent);color:#F6F1EA;display:grid;place-items:center;margin:0 auto 14px}
.logo-big .ic{width:36px;height:36px}
.link.block{display:block}
.hist{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hist summary{font-size:14px;color:var(--accent);font-weight:600;padding:2px 0}
.ev{display:flex;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid #F1EBE3}
.ev:last-child{border-bottom:0}
.ev-d{color:var(--muted);flex:none;width:44px}
.prev{white-space:pre-wrap;background:#E7F5EC;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14.5px;line-height:1.45;border:1px solid #CFE8D8}
.fila-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog{height:6px;background:#E8E0D6;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--wa)}
.p-obs{font-size:12.5px;color:var(--muted);margin:-3px 0 4px;text-align:right}
.nota-a{flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.opt.on{border-color:var(--accent);background:#F3F8F5}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #CFC5B9;flex:none;position:relative}
.opt.on .radio{border-color:var(--accent)}
.opt.on .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.prev-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14.5px;line-height:1.55}
.roll{background:var(--warn-soft);color:#6B4B00;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
</style>
</head>

<div class="wrap" id="app"></div>
<nav class="tabs" id="nav"></nav>

<div id="toast"></div>

<script src="config.js"></script>
<script type="module">
/* Conexão com o Firebase (login + banco de dados). As chaves ficam em config.js. */
const C=window.FIREBASE_CONFIG;
try{
  if(!window.__STORE && C && C.apiKey && !/COLE/.test(C.apiKey)){
    const V='10.12.2', B='https://www.gstatic.com/firebasejs/'+V+'/';
    const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail},fsm]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,deleteDoc}=fsm;
    const app=initializeApp(C); const auth=getAuth(app);
    let fs; try{ fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }catch(e){ fs=initializeFirestore(app,{}); }
    window.__STORE={
      onAuth:cb=>onAuthStateChanged(auth,u=>cb(u?{email:u.email}:null)),
      entrar:(e,s)=>signInWithEmailAndPassword(auth,e,s),
      sair:()=>signOut(auth),
      recuperar:e=>sendPasswordResetEmail(auth,e),
      watchClientes:(cb,err)=>onSnapshot(collection(fs,'clientes'),s=>cb(s.docs.map(d=>({id:d.id,data:d.data()}))),err),
      watchConfig:(cb,err)=>onSnapshot(doc(fs,'config','geral'),s=>cb(s.exists()?s.data():null),err),
      setCliente:(id,data)=>setDoc(doc(fs,'clientes',id),data),
      delCliente:id=>deleteDoc(doc(fs,'clientes',id)),
      setConfig:data=>setDoc(doc(fs,'config','geral'),data)
    };
  }
}catch(e){ console.error('Firebase não carregou',e); }
window.__FB_PRONTO=true; window.dispatchEvent(new Event('fb-pronto'));
</script>

/* ============ Utilidades ============ */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje = () => iso(new Date());
const parseD = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
function addMeses(s,n){ const [y,m,d]=s.split('-').map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); t.setDate(Math.min(d,last)); return iso(t); }
function addDias(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); }
const diffDias = (a,b) => Math.round((parseD(a)-parseD(b))/86400000);
const fmtD = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; };
const fmtDc = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m; };
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const R = v => BRL.format(Math.round((v||0)*100)/100);
const c2 = v => Math.round((v||0)*100)/100;
function num(s){ if(typeof s==='number') return isFinite(s)?c2(s):0; s=String(s||'').trim().replace(/[R$\s]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isFinite(v)?c2(v):0; }
const brNum = v => c2(v).toFixed(2).replace('.',',');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const $ = id => document.getElementById(id);
const plural = (n,a,b) => n===1?a:b;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function fone(s){ let d=String(s||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('0')) d=d.replace(/^0+/,''); if(!(d.startsWith('55') && d.length>=12)) d='55'+d; return (d.length>=12 && d.length<=13)?d:''; }
function fmtFone(s){ const d=String(s||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,''); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s||''; }

/* ============ Cálculo do saldo ============
   Pagamento = valor recebido. Abate da parcela mais antiga em aberto
   (ou primeiro da nota escolhida). O que passa vira crédito.            */
let CACHE=null;
const invalidate = () => { CACHE=null; };
function calc(){
  if(CACHE) return CACHE;
  const t=hoje(); const por=new Map();
  for(const [id,c] of S.clientes) por.set(id,{id,c,notas:[],pags:[],parcelas:[],saldo:0,vencido:0,dias:0,credito:0,prox:null,oldestVenc:null,notaInfo:{}});
  for(const [id,n] of S.notas){ const r=por.get(n.clienteId); if(r) r.notas.push({id,...n}); }
  for(const [id,p] of S.pags){ const r=por.get(p.clienteId); if(r) r.pags.push({id,...p}); }
  const ord=(a,b)=>(a.data||'').localeCompare(b.data||'')||(a.criadoEm||0)-(b.criadoEm||0);
  for(const r of por.values()){
    r.notas.sort(ord); r.pags.sort(ord);
    const al=alocar(r.notas,r.pags,t); const ps=al.ps; r.credito=al.credito;
    r.parcelas=ps;
    for(const p of ps){ p.falta=c2(p.valor-p.pago); if(p.falta>0.004){ r.saldo+=p.falta; if(p.venc<t){ r.vencido+=p.falta; if(!r.oldestVenc) r.oldestVenc=p.venc; } else if(!r.prox) r.prox=p; } }
    r.saldo=c2(r.saldo); r.vencido=c2(r.vencido); r.dias=r.oldestVenc?diffDias(t,r.oldestVenc):0;
    for(const n of r.notas){ const my=ps.filter(p=>p.notaId===n.id).sort((a,b)=>a.i-b.i); const tot=my.reduce((s,p)=>s+p.valor,0), pg=my.reduce((s,p)=>s+p.pago,0); r.notaInfo[n.id]={parcelas:my,total:c2(tot),pago:c2(pg),falta:c2(tot-pg)}; }
  }
  CACHE={por,t}; return CACHE;
}
const linha = id => calc().por.get(id);
/* Distribui os pagamentos nas parcelas. Cada nota pode ter "transf": restantes
   que passaram de uma parcela para outra (ligados ao pagamento que os gerou). */
function alocar(notas,pags,t){
  const ps=[];
  for(const n of notas){ const tr=n.transf||[];
    (n.parcelas||[]).forEach((p,i)=>{ const orig=num(p.valor); const ent=c2(tr.filter(x=>x.para===i).reduce((s,x)=>s+num(x.valor),0)); const sai=c2(tr.filter(x=>x.de===i).reduce((s,x)=>s+num(x.valor),0));
      ps.push({notaId:n.id,i,venc:p.venc||n.data||t,orig,ent,sai,valor:c2(orig+ent-sai),restante:!!p.restante,pago:0,notaData:n.data||'',abates:[]}); }); }
  ps.sort((a,b)=>a.venc.localeCompare(b.venc)||a.notaData.localeCompare(b.notaData)||a.i-b.i);
  const take=(list,rem,pg)=>{ for(const p of list){ if(rem<=0.004) break; const f=c2(p.valor-p.pago); if(f<=0.004) continue; const x=Math.min(f,rem); p.pago=c2(p.pago+x); rem=c2(rem-x); p.abates.push({pagId:pg.id,data:pg.data,valor:x,forma:pg.forma||''}); } return rem; };
  let credito=0;
  for(const pg of pags){ let rem=num(pg.valor); if(pg.notaId) rem=take(ps.filter(p=>p.notaId===pg.notaId),rem,pg); rem=take(ps,rem,pg); credito=c2(credito+rem); }
  for(const p of ps) p.falta=c2(p.valor-p.pago);
  return {ps,credito};
}
const nomeParc=(p,tot)=>p.restante?'Restante':(tot>1?(p.i+1)+'ª':'Parcela');
const valorExib=p=>c2(p.orig+p.ent);
/* Simula um pagamento novo e planeja a passagem do restante para a próxima parcela */
function planejarPagamento(cid,pag,rolar){
  const raw=RAW.get(cid)||{}; const t=hoje();
  const notas=clone(raw.notas||[]); const pags=[...(raw.pagamentos||[]).map(x=>({...x})),pag].sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.criadoEm||0)-(b.criadoEm||0));
  const {ps,credito}=alocar(notas,pags,t);
  const toc=ps.filter(p=>p.abates.some(a=>a.pagId===pag.id));
  // só passa o restante quando o pagamento não cobriu a primeira parcela que ele tocou
  const parcial=(toc.length===1 && toc[0].falta>0.004) ? toc[0] : null;
  let plano=null;
  if(parcial && rolar){
    const n=notas.find(x=>x.id===parcial.notaId); const doNota=ps.filter(p=>p.notaId===n.id).sort((a,b)=>a.i-b.i);
    const prox=doNota.find(p=>p.i>parcial.i && p.falta>0.004);
    if(prox) plano={notaId:n.id,de:parcial.i,para:prox.i,valor:parcial.falta,novaParcela:null,proxValor:c2(prox.valor+parcial.falta),proxNome:nomeParc(prox,doNota.length),proxVenc:prox.venc};
    else { const base=parcial.venc>t?parcial.venc:t; plano={notaId:n.id,de:parcial.i,para:(n.parcelas||[]).length,valor:parcial.falta,novaParcela:{venc:addMeses(base,1),valor:0,restante:true},proxValor:parcial.falta,proxNome:'Restante',proxVenc:addMeses(base,1)}; }
  }
  return {toc,parcial,plano,sobra:credito-(linha(cid)?linha(cid).credito:0),ps};
}

/* ============ Banco de dados ============
   Uma ficha por cliente no Firebase, com as notas e os pagamentos dentro.
   Assim, abrir o app lê ~1 documento por cliente (cabe folgado no plano grátis). */
let STORE=null; const RAW=new Map();
const novoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function gravar(p){ p.catch(falhou); return Promise.race([p,new Promise(r=>setTimeout(r,1500))]); }
function reconstruir(){
  S.clientes.clear(); S.notas.clear(); S.pags.clear();
  for(const [id,c] of RAW){
    const {notas,pagamentos,...dados}=c; S.clientes.set(id,dados);
    for(const n of (notas||[])) S.notas.set(n.id,{...n,clienteId:id});
    for(const p of (pagamentos||[])) S.pags.set(p.id,{...p,clienteId:id});
  }
  invalidate();
}
function mutar(cid,fn){
  if(!STORE) return Promise.reject({code:'sem_db'});
  const atual=RAW.get(cid); if(!atual) return Promise.reject({code:'nao-existe'});
  const novo=fn(clone(atual)); novo.atualizadoEm=Date.now();
  RAW.set(cid,novo); reconstruir(); render();
  return gravar(STORE.setCliente(cid,novo));
}
const D={
  async salvarCliente(id,dados){
    if(!STORE) throw {code:'sem_db'};
    if(!id){ id=novoId(); const doc={notas:[],pagamentos:[],...dados,criadoEm:Date.now()}; RAW.set(id,doc); reconstruir(); render(); await gravar(STORE.setCliente(id,doc)); return id; }
    await mutar(id,c=>({...c,...dados})); return id;
  },
  async apagarCliente(id){ RAW.delete(id); reconstruir(); render(); await gravar(STORE.delCliente(id)); },
  async salvarNota(cid,id,nota){ id=id||novoId(); const {clienteId,...n}=nota; await mutar(cid,c=>{ c.notas=(c.notas||[]).filter(x=>x.id!==id); c.notas.push({id,...n}); return c; }); return id; },
  async apagarNota(id){ const n=S.notas.get(id); if(!n) return; await mutar(n.clienteId,c=>{ c.notas=(c.notas||[]).filter(x=>x.id!==id); return c; }); },
  async salvarPag(cid,id,pag){ id=id||novoId(); const {clienteId,...p}=pag; await mutar(cid,c=>{ c.pagamentos=(c.pagamentos||[]).filter(x=>x.id!==id); c.pagamentos.push({id,...p}); return c; }); return id; },
  async apagarPag(id){ const p=S.pags.get(id); if(!p) return; await mutar(p.clienteId,c=>{ c.pagamentos=(c.pagamentos||[]).filter(x=>x.id!==id);
      for(const n of (c.notas||[])){ if(!n.transf||!n.transf.length) continue; n.transf=n.transf.filter(x=>x.pagId!==id);
        while(n.parcelas&&n.parcelas.length && n.parcelas[n.parcelas.length-1].restante && !n.transf.some(x=>x.para===n.parcelas.length-1||x.de===n.parcelas.length-1)) n.parcelas.pop(); }
      return c; }); },
  async receber(cid,pag,plano){ const id=novoId(); await mutar(cid,c=>{ c.pagamentos=[...(c.pagamentos||[]),{id,...pag}];
      if(plano){ const n=(c.notas||[]).find(x=>x.id===plano.notaId); if(n){ if(plano.novaParcela) n.parcelas=[...(n.parcelas||[]),plano.novaParcela]; n.transf=[...(n.transf||[]),{pagId:id,de:plano.de,para:plano.para,valor:plano.valor}]; } }
      return c; }); return id; },
  async salvarConfig(dados){ if(!STORE) throw {code:'sem_db'}; S.config=dados; invalidate(); render(); await gravar(STORE.setConfig(dados)); }
};
function falhou(e){
  console.error(e);
  const code=e&&e.code||'';
  if(code==='permission-denied') return toast('Este e-mail não tem permissão. Fale com a Joice.');
  if(code==='resource-exhausted') return toast('Limite diário do plano grátis atingido. Volta a funcionar amanhã.');
  toast(code==='sem_db' ? 'Sem conexão com os dados.' : 'Não deu para salvar. Tente de novo.');
}

function todosCarregados(){ return S.loaded.c && S.loaded.g; }
let unsubs=[];
function conectarDados(){
  unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs=[];
  S.loaded={c:false,g:false}; S.erro=null; S.slow=false; render();
  const timer=setTimeout(()=>{ if(!todosCarregados()){ S.slow=true; render(); } },10000);
  const done=()=>{ if(todosCarregados()){ clearTimeout(timer); S.slow=false; } };
  const err=e=>{ console.error(e); S.erro=e&&e.code||'erro'; clearTimeout(timer); render(); };
  unsubs.push(STORE.watchClientes(docs=>{ RAW.clear(); docs.forEach(d=>RAW.set(d.id,d.data)); reconstruir(); S.loaded.c=true; done(); render(); },err));
  unsubs.push(STORE.watchConfig(d=>{ S.config=d; S.loaded.g=true; invalidate(); done(); render(); },err));
}
async function init(){
  render();
  if(!window.__STORE && !window.__FB_PRONTO) await new Promise(r=>window.addEventListener('fb-pronto',r,{once:true}));
  STORE=window.__STORE||null;
  if(!STORE){ const C=window.FIREBASE_CONFIG; S.tela=(C&&C.apiKey&&!/COLE/.test(C.apiKey))?'semnet':'config'; return render(); }
  STORE.onAuth(u=>{
    S.usuario=u;
    if(!u){ unsubs.forEach(x=>{try{x();}catch(e){}}); unsubs=[]; RAW.clear(); reconstruir(); S.tela='login'; render(); return; }
    S.tela='app'; conectarDados();
  });
}

  else if(S.tela==='login') h=telaLogin();

  }

}

function telaHoje(){

  const d=new Date(); const dias=['domingo','segunda','terça','quarta','quinta','sexta','sábado']; const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  if(ios && !instalado && lsGet('dicaInstalar')!=='ok') h+=`<div class="banner info" style="display:flex;gap:10px;align-items:flex-start"><span style="flex:1"><b>Deixe como aplicativo:</b> toque em <b>Compartilhar</b> (o quadrado com a setinha ↑), depois em <b>Adicionar à Tela de Início</b>. Pronto: vira um ícone igual aos outros apps.</span><button data-act="fechar-dica" aria-label="Fechar" style="font-size:20px;line-height:1;color:inherit">×</button></div>`;
  if(arr.length===0) return h+`<div class="card mt" style="margin-top:18px"><div class="empty" style="padding:14px 6px"><b>Vamos começar 👋</b>Cadastre primeiro quem tem notinha em aberto. Para cada cliente, lance só o <b style="display:inline;font-size:inherit">saldo que falta</b> e as próximas datas, sem precisar copiar o histórico.</div><button class="btn block" data-act="saldo-antigo">${I.note} Lançar saldo de notinha antiga</button><button class="btn sec block mt" data-act="nova-venda">${I.bag} Nova venda</button></div>`;
  const atras=arr.filter(r=>r.vencido>0).sort((a,b)=>b.dias-a.dias||b.vencido-a.vencido);
  const lim=addDias(t,7); const semana=[];
  for(const r of arr) for(const p of r.parcelas) if(p.falta>0.004 && p.venc>=t && p.venc<=lim) semana.push({r,p});
  semana.sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
  const tot=arr.reduce((s,r)=>s+r.saldo,0), venc=arr.reduce((s,r)=>s+r.vencido,0), sem=semana.reduce((s,x)=>s+x.p.falta,0);
  h+=`<div class="stats"><div class="stat late"><div class="k">Em atraso</div><div class="v">${R(venc)}</div><div class="s">${atras.length} ${plural(atras.length,'cliente','clientes')}</div></div><div class="stat"><div class="k">A receber no total</div><div class="v">${R(tot)}</div><div class="s">${R(sem)} nos próximos 7 dias</div></div></div>`;
  h+=`<h2>Atrasadas</h2>`;
  if(atras.length>1) h+=`<button class="btn wa block" style="margin-bottom:10px" data-act="fila">${I.wa} Cobrar todas em sequência (${atras.length})</button>`;
  if(!atras.length) h+=`<div class="card"><div class="empty" style="padding:10px"><b>Ninguém atrasado 🎉</b>Todas as parcelas vencidas estão pagas.</div></div>`;
  else h+=`<div class="list">${atras.map(r=>{
    const cob=r.c.ultimaCobranca?` · cobrada ${quando(r.c.ultimaCobranca)}`:'';
    return `<div class="row"><button class="row-main" data-act="abrir" data-id="${r.id}"><b>${esc(r.c.nome)}</b><small class="late">${R(r.vencido)} · há ${r.dias} ${plural(r.dias,'dia','dias')}<span class="muted">${cob}</span></small></button><button class="mini wa" data-act="cobrar" data-id="${r.id}" aria-label="Cobrar">${I.wa}</button><button class="mini acc" data-act="receber" data-id="${r.id}" aria-label="Receber">${I.money}</button></div>`;
  }).join('')}</div>`;
  h+=`<h2>Vencem nos próximos 7 dias</h2>`;
  if(!semana.length) h+=`<div class="card"><div class="empty" style="padding:10px">Nada vence esta semana.</div></div>`;
  else h+=`<div class="list">${semana.map(({r,p})=>`<div class="row"><button class="row-main" data-act="abrir" data-id="${r.id}"><b>${esc(r.c.nome)}</b><small>${p.venc===t?'<b style="display:inline;color:var(--warn)">vence hoje</b>':'vence '+fmtDc(p.venc)}${p.pago>0?' · já pagou '+R(p.pago):''}</small></button><div class="amt">${R(p.falta)}</div><button class="mini wa" data-act="cobrar" data-id="${r.id}" aria-label="Lembrar">${I.wa}</button></div>`).join('')}</div>`;
  return h;
}
function quando(s){ const d=diffDias(hoje(),s); return d<=0?'hoje':d===1?'ontem':`há ${d} dias`; }

/* ---------- Clientes ---------- */
function telaClientes(){
  const {por}=calc(); let arr=[...por.values()];
  const counts={todas:arr.length,devendo:arr.filter(r=>r.saldo>0).length,atrasadas:arr.filter(r=>r.vencido>0).length,avista:arr.filter(r=>r.c.soAvista).length,semzap:arr.filter(r=>!fone(r.c.whatsapp)).length};
  let h=`<div class="top"><div class="grow"><h1>Clientes</h1></div><button class="btn sm sec" data-act="nova-cliente">${I.plus} Cliente</button></div>`;
  h+=`<div class="search">${I.search}<input id="busca" class="in" placeholder="Buscar pelo nome" value="${esc(S.busca)}" autocomplete="off"></div>`;
  const ch=(id,t)=>`<button class="chip ${S.filtro===id?'on':''}" data-act="filtro" data-id="${id}">${t} · ${counts[id]}</button>`;
  h+=`<div class="chips mt">${ch('todas','Todas')}${ch('devendo','Devendo')}${ch('atrasadas','Atrasadas')}${ch('avista','Só à vista')}${counts.semzap?ch('semzap','Sem WhatsApp'):''}</div>`;
  h+=`<div id="lista-cli" class="mt">${listaClientes()}</div>`;
  return h;
}
function listaClientes(){
  const {por}=calc(); let arr=[...por.values()];
  if(S.filtro==='devendo') arr=arr.filter(r=>r.saldo>0);
  if(S.filtro==='atrasadas') arr=arr.filter(r=>r.vencido>0);
  if(S.filtro==='avista') arr=arr.filter(r=>r.c.soAvista);
  if(S.filtro==='semzap') arr=arr.filter(r=>!fone(r.c.whatsapp));
  const q=norm(S.busca); if(q) arr=arr.filter(r=>norm(r.c.nome).includes(q));
  arr.sort((a,b)=>S.filtro==='atrasadas'?b.dias-a.dias:norm(a.c.nome).localeCompare(norm(b.c.nome)));
  if(!arr.length) return `<div class="card"><div class="empty">${q?'Nenhuma cliente com esse nome.':'Nenhuma cliente aqui.'}${q?`<div class="mt"><button class="btn sm sec" data-act="nova-cliente" data-nome="${esc(S.busca)}">${I.plus} Cadastrar “${esc(S.busca)}”</button></div>`:''}</div></div>`;
  return `<div class="list">${arr.map(r=>{
    let sub, tag='';
    if(r.vencido>0){ sub=`<small class="late">${R(r.vencido)} atrasado · há ${r.dias} ${plural(r.dias,'dia','dias')}</small>`; }
    else if(r.saldo>0){ sub=`<small>Em dia${r.prox?' · próxima '+fmtDc(r.prox.venc):''}</small>`; }
    else sub=`<small>Sem débitos</small>`;
    if(r.c.soAvista) tag=' <span class="tag warn">só à vista</span>';
    return `<button class="row" style="width:100%" data-act="abrir" data-id="${r.id}"><span class="row-main"><b>${esc(r.c.nome)}${tag}</b>${sub}</span><span class="amt">${r.saldo>0?R(r.saldo):'<span class="muted">—</span>'}</span></button>`;
  }).join('')}</div>`;
}

  if(r.credito>0) h+=`<div class="banner info">Pagou ${R(r.credito)} a mais. Esse crédito abate a próxima compra automaticamente.</div>`;

  const abertas=r.notas.filter(n=>r.notaInfo[n.id].falta>0.004).reverse();
  const quitadas=r.notas.filter(n=>r.notaInfo[n.id].falta<=0.004).reverse();
  h+=`<h2>Notas em aberto (${abertas.length})</h2>`;
  h+= abertas.length? abertas.map(n=>notaCard(r,n,t)).join('') : `<div class="card"><div class="empty" style="padding:10px">Nenhuma nota em aberto.</div></div>`;
  if(quitadas.length) h+=`<details class="mt"><summary><h2 style="margin-top:14px">Notas quitadas (${quitadas.length}) ›</h2></summary>${quitadas.map(n=>notaCard(r,n,t)).join('')}</details>`;
  h+=`<h2>Pagamentos recebidos (${r.pags.length})</h2>`;
  if(!r.pags.length) h+=`<div class="card"><div class="empty" style="padding:10px">Nenhum pagamento lançado.</div></div>`;
  else h+=`<div class="list">${[...r.pags].reverse().map(p=>{ const nt=p.notaId&&S.notas.get(p.notaId); return `<div class="row"><div class="row-main"><b>${R(p.valor)}</b><small>${fmtD(p.data)} · ${esc(p.forma||'')}${p.banco?' · '+esc(p.banco):''}${nt?' · nota de '+fmtDc(nt.data):''}${p.obs?' · '+esc(p.obs):''}</small></div>${p.conferido?'<span class="tag ok">conferido</span>':''}<button class="mini" style="color:var(--muted)" data-act="apagar-pag" data-id="${p.id}" aria-label="Apagar">${I.trash}</button></div>`; }).join('')}</div>`;

  return h;
}
function notaCard(r,n,t){
  const inf=r.notaInfo[n.id];
  const status = inf.falta<=0.004?'<span class="tag ok">quitada</span>' : inf.parcelas.some(p=>p.falta>0.004&&p.venc<t)?'<span class="tag late">atrasada</span>':'<span class="tag">em aberto</span>';
  const titulo = n.tipo==='saldo'?'Saldo de notinha antiga':'Nota de '+fmtD(n.data);
  const itens=(n.itens||[]).map(it=>`<div><span>${num(it.qtd)||1}× ${esc(it.desc||'item')}</span><span>${R((num(it.qtd)||1)*num(it.valor))}</span></div>`).join('');
  const parc=inf.parcelas.map((p,k)=>{
    let st; if(p.falta<=0.004) st='<span class="tag ok">paga</span>'; else if(p.pago>0) st=`<span class="tag ${p.venc<t?'late':'warn'}">pagou ${R(p.pago)}</span>`; else if(p.venc<t) st='<span class="tag late">vencida</span>'; else st='<span class="tag mut">aberta</span>';
    const L=inf.parcelas.length; const nota2=[]; if(p.ent>0) nota2.push(p.restante?`o que faltou das parcelas anteriores`:`${R(p.orig)} + ${R(p.ent)} que faltou da anterior`); if(p.sai>0) nota2.push(`${R(p.sai)} que faltou passou para a próxima`);
    return `<div class="p"><span>${nomeParc(p,L)} · ${fmtD(p.venc)}</span><span style="display:flex;gap:8px;align-items:center">${st}<b>${R(valorExib(p))}</b></span></div>${nota2.length?`<div class="p-obs">${nota2.join(' · ')}</div>`:''}`;
  }).join('');
  return `<div class="nota"><div class="nota-h"><div><b>${titulo}</b><div class="sub">${R(inf.total)}${inf.pago>0&&inf.falta>0.004?' · falta '+R(inf.falta):''}</div></div>${status}</div>${itens?`<div class="itens">${itens}</div>`:''}<div class="parc">${parc}</div>${n.obs?`<div class="hint">${esc(n.obs)}</div>`:''}<details class="hist"><summary>Histórico (${historicoNota(r,n).length}) ›</summary>${historicoNota(r,n).map(e=>`<div class="ev"><span class="ev-d">${fmtDc(e.data)}</span><span>${esc(e.txt)}</span></div>`).join('')}</details><div class="nota-a">${inf.falta>0.004?`<button class="btn sm" data-act="receber-nota" data-id="${n.id}">${I.money} Receber</button>`:''}<button class="btn sm sec" data-act="enviar-nota" data-id="${n.id}">${I.wa} Enviar</button><button class="btn sm ghost" data-act="editar-nota" data-id="${n.id}">${I.edit} Editar</button><button class="btn sm ghost" data-act="apagar-nota" data-id="${n.id}" style="color:var(--late)">${I.trash} Excluir</button></div></div>`;
}

/* ---------- Conferir ---------- */
function periodo(){
  const t=hoje(); const d=parseD(t);
  if(S.conf==='semana'){ const dow=(d.getDay()+6)%7; return [addDias(t,-dow),t,'Esta semana']; }
  if(S.conf==='passada'){ const dow=(d.getDay()+6)%7; const ini=addDias(t,-dow-7); return [ini,addDias(ini,6),'Semana passada']; }
  if(S.conf==='mes'){ return [t.slice(0,8)+'01',t,'Este mês']; }
  const ini=addMeses(t.slice(0,8)+'01',-1); return [ini,addDias(t.slice(0,8)+'01',-1),'Mês passado'];
}
function telaConferir(){
  const [ini,fim]=periodo(); const {por}=calc();
  let h=`<h1>Conferir</h1><div class="sub">Abra o extrato de cada banco e marque o que bateu.</div>`;
  const ch=(id,t)=>`<button class="chip ${S.conf===id?'on':''}" data-act="conf" data-id="${id}">${t}</button>`;
  h+=`<div class="chips mt">${ch('semana','Esta semana')}${ch('passada','Semana passada')}${ch('mes','Este mês')}${ch('mespass','Mês passado')}</div><div class="hint">${fmtD(ini)} a ${fmtD(fim)}</div>`;
  const pags=[...S.pags.entries()].map(([id,p])=>({id,...p})).filter(p=>p.data>=ini&&p.data<=fim);
  const grupos={}; for(const p of pags){ const k=p.forma==='Dinheiro'?'Dinheiro':(p.banco||p.forma||'Outros'); (grupos[k]=grupos[k]||[]).push(p); }
  const total=pags.reduce((s,p)=>s+num(p.valor),0); const ok=pags.filter(p=>p.conferido).length;
  h+=`<h2>Recebimentos lançados · ${R(total)}</h2>`;
  if(!pags.length) h+=`<div class="card"><div class="empty" style="padding:10px">Nenhum pagamento lançado nesse período.</div></div>`;
  else{
    h+=`<div class="hint" style="margin:-4px 4px 8px">${ok} de ${pags.length} conferidos</div><div class="list">`;
    for(const k of Object.keys(grupos).sort()){
      const g=grupos[k].sort((a,b)=>a.data.localeCompare(b.data)); const gt=g.reduce((s,p)=>s+num(p.valor),0);
      h+=`<div class="grp-h"><span>${esc(k)}</span><span>${R(gt)} <small>· ${g.filter(p=>p.conferido).length}/${g.length}</small></span></div>`;
      h+=g.map(p=>{ const c=S.clientes.get(p.clienteId); return `<div class="row"><button class="check ${p.conferido?'on':''}" data-act="conferir-pag" data-id="${p.id}" aria-label="Conferido">${I.check}</button><button class="row-main" data-act="abrir" data-id="${p.clienteId}"><b>${esc(c?c.nome:'(cliente apagada)')}</b><small>${fmtD(p.data)} · ${esc(p.forma||'')}</small></button><div class="amt">${R(p.valor)}</div></div>`; }).join('');
    }
    h+=`</div>`;
  }
  const pend=[]; for(const r of por.values()) for(const p of r.parcelas) if(p.falta>0.004 && p.venc>=ini && p.venc<=fim && p.venc<hoje()) pend.push({r,p});
  pend.sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
  h+=`<h2>Venceu no período e falta pagar</h2>`;
  if(!pend.length) h+=`<div class="card"><div class="empty" style="padding:10px">Tudo que venceu nesse período está pago.</div></div>`;
  else h+=`<div class="hint" style="margin:-4px 4px 8px">Se alguma dessas pagou e você ainda não lançou, toque em receber.</div><div class="list">${pend.map(({r,p})=>`<div class="row"><button class="row-main" data-act="abrir" data-id="${r.id}"><b>${esc(r.c.nome)}</b><small class="late">venceu ${fmtDc(p.venc)}${p.pago>0?' · pagou '+R(p.pago):''}</small></button><div class="amt">${R(p.falta)}</div><button class="mini acc" data-act="receber" data-id="${r.id}" aria-label="Receber">${I.money}</button></div>`).join('')}</div>`;
  return h;
}

function pickerRes(){
  const q=norm(CTX.pkq); if(!q) return '';
  const list=[...S.clientes.entries()].filter(([,c])=>norm(c.nome).includes(q)).sort((a,b)=>norm(a[1].nome).indexOf(q)-norm(b[1].nome).indexOf(q)).slice(0,6);
  return list.map(([id,c])=>`<button class="pk-item" data-act="pk-sel" data-id="${id}">${esc(c.nome)}${c.soAvista?' <span class="tag warn">só à vista</span>':''}</button>`).join('') + `<button class="pk-item novo" data-act="pk-novo">+ Cadastrar “${esc(CTX.pkq.trim())}” como nova cliente</button>`;
}

/* --- Nova venda / saldo antigo / editar nota --- */
function abrirVenda({clienteId=null, notaId=null, modo='venda'}={}){
  if(bloqueado()) return;
  const t=hoje();
  if(notaId){
    const n=S.notas.get(notaId); if(!n) return;
    CTX={kind:'venda', notaId, modo:n.tipo==='saldo'?'saldo':'venda', clienteId:n.clienteId, fixo:true, data:n.data, itens:(n.itens||[]).map(i=>({qtd:String(num(i.qtd)||1),desc:i.desc||'',valor:brNum(i.valor)})), tipo:'parcelado', n:(n.parcelas||[]).length||1, primeiro:(n.parcelas&&n.parcelas[0]&&n.parcelas[0].venc)||addMeses(n.data,1), parcelas:(linha(n.clienteId).notaInfo[notaId]?linha(n.clienteId).notaInfo[notaId].parcelas.map(p=>({venc:p.venc,valor:brNum(p.valor)})):(n.parcelas||[]).map(p=>({venc:p.venc,valor:brNum(p.valor)}))), editado:true, nTocado:true, obs:n.obs||'', criadoEm:n.criadoEm};
    if(!CTX.itens.length) CTX.itens=[{qtd:'1',desc:'',valor:''}];
  } else {
    const saldo=modo==='saldo';
    CTX={kind:'venda', modo, clienteId, fixo:!!clienteId, pkq:'', data:t, itens:[{qtd:'1',desc:saldo?'Saldo de notinha anterior':'',valor:''}], tipo:'parcelado', n:1, primeiro:saldo?t:addMeses(t,1), parcelas:[], editado:false, nTocado:false, obs:'', forma:'Pix', banco:lsGet('ultimoBanco')||cfg().bancos[0]};
    recalcParcelas();
  }
  abrirSheet(notaId?'Editar nota':(modo==='saldo'?'Saldo de notinha antiga':'Nova venda'));
  renderVenda();
}
const totalVenda = () => c2(CTX.itens.reduce((s,i)=>s+(num(i.qtd)||0)*num(i.valor),0));
function sugerirN(){ const tot=totalVenda(); return Math.max(1,Math.min(12,Math.ceil(tot/(cfg().reaisPorMes||100)-0.0001))); }
function recalcParcelas(){
  const tot=totalVenda(); if(!CTX.nTocado) CTX.n=tot>0?sugerirN():1;
  const n=CTX.n; const cents=Math.round(tot*100); const base=Math.floor(cents/n); const resto=cents-base*n;
  CTX.parcelas=Array.from({length:n},(_,i)=>({venc:addMeses(CTX.primeiro,i), valor:brNum((base+(i<resto?1:0))/100)}));
  CTX.editado=false;
}
function renderVenda(){
  const saldo=CTX.modo==='saldo'; const c=CTX.clienteId&&S.clientes.get(CTX.clienteId);
  let h=`<div id="v-cli">${pickerHTML()}</div>`;
  if(c&&c.soAvista&&CTX.tipo==='parcelado'&&!saldo) h+=`<div class="banner warn">⚠️ ${esc(c.nome)} está marcada como <b>só à vista</b>.</div>`;
  if(saldo && !CTX.notaId) h+=`<div class="banner info">Lance só o que falta pagar da notinha de papel, com as próximas datas. Não precisa copiar o histórico.</div>`;
  h+=`<label class="lbl">${saldo?'Data da notinha original':'Data da venda'}</label><input class="in" type="date" data-f="data" value="${CTX.data}">`;
  h+=`<label class="lbl">${saldo?'O que falta pagar':'Produtos'}</label><div id="v-itens">${itensHTML()}</div>`;
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><button class="btn sm sec" data-act="ditar">🎤 Falar os produtos</button><button class="btn sm ghost" data-act="add-item">+ Adicionar produto</button></div><div id="v-dit"></div>`;
  h+=`<div class="total-line"><span class="muted">Total</span><b id="v-total">${R(totalVenda())}</b></div>`;
  if(!saldo && !CTX.notaId) h+=`<label class="lbl">Pagamento</label><div class="seg"><button class="${CTX.tipo==='parcelado'?'on':''}" data-act="tipo" data-id="parcelado">Parcelado</button><button class="${CTX.tipo==='avista'?'on':''}" data-act="tipo" data-id="avista">À vista (pago agora)</button></div>`;
  h+=`<div id="v-parc">${CTX.tipo==='avista'?avistaHTML():parcHTML()}</div>`;
  h+=`<label class="lbl">Observação (opcional)</label><input class="in" data-f="obs" value="${esc(CTX.obs)}" placeholder="Ex.: combinou pagar dia 10">`;
  $('sheet-b').innerHTML=h;
  $('sheet-f').innerHTML=CTX.notaId?`<button class="btn ghost" data-act="fechar" style="flex:0 0 auto">Cancelar</button><button class="btn" data-act="salvar-venda">Salvar</button>`:`<button class="btn ghost" data-act="salvar-outra">Salvar e lançar outra</button><button class="btn" data-act="salvar-venda">Salvar</button>`;
}
function itensHTML(){
  return CTX.itens.map((it,i)=>`<div class="item-row"><input class="in" inputmode="numeric" data-it="qtd" data-i="${i}" value="${esc(it.qtd)}" aria-label="Quantidade"><input class="in" data-it="desc" data-i="${i}" value="${esc(it.desc)}" placeholder="Produto" aria-label="Produto"><input class="in" inputmode="decimal" data-it="valor" data-i="${i}" value="${esc(it.valor)}" placeholder="0,00" aria-label="Valor"><button class="rm" data-act="rm-item" data-id="${i}" aria-label="Remover" ${CTX.itens.length<2?'style="visibility:hidden"':''}>${I.trash}</button></div>`).join('') + `<div class="hint" style="display:grid;grid-template-columns:52px 1fr 104px 32px;gap:6px;margin-top:-2px"><span>qtd</span><span>produto</span><span>valor unit.</span></div>`;
}
function parcHTML(){
  return `<div class="two"><div><label class="lbl">Parcelas</label><div class="stepper"><button data-act="n-menos">−</button><span>${CTX.n}x</span><button data-act="n-mais">+</button></div></div><div><label class="lbl">1º vencimento</label><input class="in" type="date" data-f="primeiro" value="${CTX.primeiro}"></div></div>
  <div class="mt" id="v-plist">${CTX.parcelas.map((p,i)=>`<div class="parc-row"><span class="n">${i+1}ª</span><input class="in" type="date" data-pc="venc" data-i="${i}" value="${p.venc}"><input class="in" inputmode="decimal" data-pc="valor" data-i="${i}" value="${esc(p.valor)}"></div>`).join('')}</div><div id="v-soma">${somaHTML()}</div>`;
}
function somaHTML(){
  const s=c2(CTX.parcelas.reduce((a,p)=>a+num(p.valor),0)); const t=totalVenda();
  if(Math.abs(s-t)<0.01) return `<div class="hint">${!CTX.nTocado&&t>0?'Sugestão pela regra de '+R(cfg().reaisPorMes)+' por mês. Datas e valores podem ser mudados.':'Datas e valores podem ser mudados.'}</div>`;
  return `<div class="banner late">As parcelas somam ${R(s)}, mas o total é ${R(t)}. <button class="link" data-act="ajustar">Dividir igual de novo</button></div>`;
}
function avistaHTML(){
  const c=cfg(); const bancos=c.bancos;
  return `<label class="lbl">Como pagou</label><div class="chips">${['Pix','Dinheiro','Cartão','Transferência'].map(f=>`<button class="chip ${CTX.forma===f?'on':''}" data-act="forma" data-id="${f}">${f}</button>`).join('')}</div>${CTX.forma==='Dinheiro'?'':`<label class="lbl">Caiu em qual banco</label><div class="chips">${bancos.map(b=>`<button class="chip ${CTX.banco===b?'on':''}" data-act="banco" data-id="${esc(b)}">${esc(b)}</button>`).join('')}</div>`}`;
}
async function salvarVenda(proxima=false){
  if(!CTX.clienteId){ return toast('Escolha a cliente.'); }
  const tot=totalVenda(); if(tot<=0) return toast('Coloque o valor dos produtos.');
  const itens=CTX.itens.filter(i=>num(i.valor)>0||i.desc.trim()).map(i=>({qtd:num(i.qtd)||1,desc:i.desc.trim(),valor:num(i.valor)}));
  let parcelas;
  if(CTX.tipo==='avista') parcelas=[{venc:CTX.data,valor:tot}];
  else{
    parcelas=CTX.parcelas.map(p=>({venc:p.venc,valor:num(p.valor)})).filter(p=>p.valor>0);
    const s=c2(parcelas.reduce((a,p)=>a+p.valor,0)); if(Math.abs(s-tot)>=0.01) return toast('A soma das parcelas não bate com o total.');
    if(parcelas.some(p=>!p.venc)) return toast('Falta a data de alguma parcela.');
  }
  const antiga=CTX.notaId?S.notas.get(CTX.notaId):null; const historico=antiga?[...(antiga.historico||[])]:[];
  if(antiga){ const mud=[]; if(Math.abs(num(antiga.total)-tot)>=0.01) mud.push(`total ${R(antiga.total)} → ${R(tot)}`); const np=(antiga.parcelas||[]).length; if(np!==parcelas.length) mud.push(`parcelas ${np}x → ${parcelas.length}x`); else if(JSON.stringify((antiga.parcelas||[]).map(p=>[p.venc,num(p.valor)]))!==JSON.stringify(parcelas.map(p=>[p.venc,p.valor]))) mud.push('datas/valores das parcelas mudaram'); if(JSON.stringify((antiga.itens||[]).map(i=>[i.desc,num(i.qtd),num(i.valor)]))!==JSON.stringify(itens.map(i=>[i.desc,i.qtd,i.valor]))) mud.push('produtos alterados'); if(antiga.transf&&antiga.transf.length){ const i2=mud.indexOf('datas/valores das parcelas mudaram'); if(i2>=0) mud.splice(i2,1); }
    if(mud.length) historico.push({em:hoje(),txt:'Notinha editada: '+mud.join('; ')}); }
  const nota={clienteId:CTX.clienteId,data:CTX.data||hoje(),itens,total:tot,parcelas,tipo:CTX.modo==='saldo'?'saldo':'venda',obs:CTX.obs.trim(),historico,parcOriginal:antiga?(antiga.parcOriginal||(antiga.parcelas||[]).length):parcelas.length,totalOriginal:antiga?(antiga.totalOriginal??num(antiga.total)):tot,criadoEm:CTX.criadoEm||Date.now(),atualizadoEm:Date.now()};
  const btn=document.querySelector('[data-act="salvar-venda"]'); if(btn) btn.disabled=true;
  try{
    const id=await D.salvarNota(CTX.clienteId,CTX.notaId||null,nota);
    if(CTX.tipo==='avista' && !CTX.notaId){
      const banco=CTX.forma==='Dinheiro'?'':CTX.banco; if(banco) lsSet('ultimoBanco',banco);
      await D.salvarPag(CTX.clienteId,null,{notaId:id,data:nota.data,valor:tot,forma:CTX.forma,banco,obs:'à vista',conferido:false,criadoEm:Date.now()});
    }
    const cid=CTX.clienteId, editando=!!CTX.notaId; fecharSheet();
    abrirFicha(cid);
    if(editando) toast('Nota atualizada.');
    else if(proxima){ abrirVenda({modo:nota.tipo==='saldo'?'saldo':'venda'}); toast(`Salvo para ${primeiroNome(S.clientes.get(cid))}! Pode lançar a próxima.`); }
    else abrirEnvioNota(id, nota.tipo==='saldo'?'Saldo lançado! Mandar para a cliente?':'Venda salva! Mandar a notinha para a cliente?');
  }catch(e){ if(btn) btn.disabled=false; falhou(e); }
}

/* --- Receber pagamento --- */
function abrirReceber({clienteId=null, notaId=''}={}){
  if(bloqueado()) return;
  CTX={kind:'receber', clienteId, fixo:!!clienteId, pkq:'', valor:'', data:hoje(), forma:'Pix', banco:lsGet('ultimoBanco')||cfg().bancos[0], notaId:notaId||'', obs:'', rolar:true};
  abrirSheet('Receber pagamento'); renderReceber();
}
function tituloNota(n){ return n.tipo==='saldo'?'Notinha antiga':'Nota de '+fmtD(n.data); }
function renderReceber(){
  let h=`<div id="v-cli">${pickerHTML()}</div>`;
  const r=CTX.clienteId&&linha(CTX.clienteId);
  if(r){
    h+=`<div class="two mt"><div class="stat ${r.vencido>0?'late':''}" style="padding:10px 12px"><div class="k">Atrasado</div><div class="v" style="font-size:19px">${R(r.vencido)}</div></div><div class="stat" style="padding:10px 12px"><div class="k">Saldo total</div><div class="v" style="font-size:19px">${R(r.saldo)}</div></div></div>`;
    const abertas=r.notas.filter(n=>r.notaInfo[n.id].falta>0.004);
    if(abertas.length>1){
      h+=`<label class="lbl">Abater de qual notinha?</label><div class="opts">`;
      h+=`<button class="opt ${!CTX.notaId?'on':''}" data-act="r-nota" data-id=""><span class="radio"></span><span><b>Automático</b><small>Começa pela mais antiga</small></span></button>`;
      h+=abertas.map(n=>{ const inf=r.notaInfo[n.id]; const pr=inf.parcelas.find(p=>p.falta>0.004); const atr=inf.parcelas.some(p=>p.falta>0.004&&p.venc<hoje());
        return `<button class="opt ${CTX.notaId===n.id?'on':''}" data-act="r-nota" data-id="${n.id}"><span class="radio"></span><span style="flex:1"><b>${tituloNota(n)}</b><small>${(n.itens||[]).map(i=>i.desc).filter(Boolean).join(', ').slice(0,60)||R(inf.total)}</small><small>${pr?`${nomeParc(pr,inf.parcelas.length)} ${fmtDc(pr.venc)}: ${R(pr.falta)}`:''}${atr?' · <b style="color:var(--late)">atrasada</b>':''}</small></span><span class="amt">${R(inf.falta)}<small>falta</small></span></button>`; }).join('');
      h+=`</div>`;
    }
    const nsel=CTX.notaId&&r.notaInfo[CTX.notaId]; const sug=[];
    if(nsel){ const pr=nsel.parcelas.find(p=>p.falta>0.004); if(pr) sug.push(['Parcela',pr.falta]); if(Math.abs(nsel.falta-(pr?pr.falta:0))>0.01) sug.push(['Nota toda',nsel.falta]); }
    else { if(r.vencido>0) sug.push(['Atrasado',r.vencido]); if(r.prox&&r.vencido<=0) sug.push(['Próxima parcela',r.prox.falta]); if(r.saldo>0&&!sug.some(x=>Math.abs(x[1]-r.saldo)<0.01)) sug.push(['Tudo',r.saldo]); }
    h+=`<label class="lbl">Valor recebido</label><input id="r-valor" class="in big" inputmode="decimal" placeholder="0,00" value="${esc(CTX.valor)}">`;
    if(sug.length) h+=`<div class="chips mt">${sug.map(([t,v])=>`<button class="chip" data-act="r-sug" data-id="${v}">${t}: ${R(v)}</button>`).join('')}</div>`;
    h+=`<div id="r-prev">${previaHTML()}</div>`;
    h+=`<label class="lbl">Data</label><input class="in" type="date" data-f="data" value="${CTX.data}">`;
    h+=`<label class="lbl">Como pagou</label><div class="chips">${['Pix','Dinheiro','Cartão','Transferência'].map(f=>`<button class="chip ${CTX.forma===f?'on':''}" data-act="forma" data-id="${f}">${f}</button>`).join('')}</div>`;
    if(CTX.forma!=='Dinheiro') h+=`<label class="lbl">Caiu em qual banco</label><div class="chips">${cfg().bancos.map(b=>`<button class="chip ${CTX.banco===b?'on':''}" data-act="banco" data-id="${esc(b)}">${esc(b)}</button>`).join('')}</div>`;
    h+=`<label class="lbl">Observação (opcional)</label><input class="in" data-f="obs" value="${esc(CTX.obs)}">`;
  }
  $('sheet-b').innerHTML=h;
  $('sheet-f').innerHTML=`<button class="btn ghost" data-act="fechar" style="flex:0 0 auto">Cancelar</button><button class="btn" data-act="salvar-receber" ${r?'':'disabled'}>Confirmar recebimento</button>`;
}
function pagNovo(){ return {id:'__novo',notaId:CTX.notaId||'',data:CTX.data||hoje(),valor:num(CTX.valor),forma:CTX.forma,criadoEm:Date.now()}; }
function previaHTML(){
  const r=linha(CTX.clienteId); const v=num(CTX.valor); if(!r||v<=0) return '';
  const sim=planejarPagamento(CTX.clienteId,pagNovo(),CTX.rolar);
  const L=[]; const porNota=new Map();
  for(const p of sim.toc){ const a=p.abates.find(x=>x.pagId==='__novo'); const arr=porNota.get(p.notaId)||[]; arr.push({p,a}); porNota.set(p.notaId,arr); }
  for(const [nid,arr] of porNota){ const n=S.notas.get(nid); const tot=(n.parcelas||[]).length;
    L.push(`<b>${tituloNota(n)}</b>`);
    for(const {p,a} of arr){ const quita=p.falta<=0.004; L.push(`• ${nomeParc(p,tot)} (${fmtDc(p.venc)}): abate ${R(a.valor)} ${quita?'→ <b style="color:var(--ok)">fica paga</b>':''}`); }
  }
  let extra='';
  if(sim.parcial){
    const nt=(S.notas.get(sim.parcial.notaId).parcelas||[]).length;
    if(CTX.rolar && sim.plano) extra=`<div class="roll">A ${nomeParc(sim.parcial,nt)} fica <b>paga</b> e os <b>${R(sim.plano.valor)}</b> que faltaram passam para ${sim.plano.novaParcela?`uma parcela <b>restante</b> em ${fmtD(sim.plano.proxVenc)}`:`a <b>${sim.plano.proxNome}</b> (${fmtDc(sim.plano.proxVenc)})`}, que fica <b>${R(sim.plano.proxValor)}</b>.</div>`;
    else extra=`<div class="roll">Ficam faltando ${R(sim.parcial.falta)} na ${nomeParc(sim.parcial,nt)} (${fmtDc(sim.parcial.venc)}).</div>`;
    extra+=`<button class="toggle" style="width:100%;text-align:left;margin-top:8px" data-act="r-rolar"><span><b>Passar o que faltou para a próxima parcela</b><small>A parcela de agora não fica em atraso</small></span><span class="sw ${CTX.rolar?'on':''}"></span></button>`;
  }
  const depois=c2(r.saldo-v);
  return `<div class="prev-box">${L.join('<br>')}${extra}<div class="hint" style="margin-top:8px">${depois>=0?`Saldo total depois: <b>${R(depois)}</b>`:`${R(-depois)} a mais que o saldo: fica de crédito para a próxima compra.`}</div></div>`;
}
async function salvarReceber(){
  const v=num(CTX.valor); if(!CTX.clienteId) return toast('Escolha a cliente.'); if(v<=0) return toast('Digite o valor recebido.');
  const banco=CTX.forma==='Dinheiro'?'':CTX.banco; if(banco) lsSet('ultimoBanco',banco);
  const cid=CTX.clienteId; const sim=planejarPagamento(cid,pagNovo(),CTX.rolar);
  const notasTocadas=[...new Set(sim.toc.map(p=>p.notaId))];
  const btn=document.querySelector('[data-act="salvar-receber"]'); if(btn) btn.disabled=true;
  try{
    await D.receber(cid,{notaId:CTX.notaId||'',data:CTX.data||hoje(),valor:v,forma:CTX.forma,banco,obs:CTX.obs.trim(),conferido:false,criadoEm:Date.now()},CTX.rolar?sim.plano:null);
    fecharSheet(); if(S.view==='cliente') S.clienteAtual=cid; render();
    const aviso=`${R(v)} lançado! Saldo agora: <b>${R(Math.max(0,linha(cid).saldo))}</b>. Mandar a atualização para ${esc(primeiroNome(S.clientes.get(cid)))}?`;
    if(notasTocadas.length===1) abrirEnvioNota(notasTocadas[0],aviso); else abrirEnvioExtrato(cid,aviso);
  }catch(e){ if(btn) btn.disabled=false; falhou(e); }
}

/* --- Cobrar no WhatsApp --- */
function tomAuto(r){ return r.vencido<=0?'lembrete':(r.dias>20?'firme':'atrasada'); }
function montarMsg(r,tom){
  const c=cfg(); const v = r.vencido>0? r.vencido : (r.prox? r.prox.falta : r.saldo);
  const venc = r.oldestVenc || (r.prox&&r.prox.venc) || hoje();
  const nome=(r.c.nome||'').trim().split(/\s+/)[0]||'';
  const pix=c.pix?` Meu Pix é ${c.pix}.`:'';
  return (c.tpl[tom]||'').split('{nome}').join(nome).split('{valor}').join(R(v)).split('{saldo}').join(R(r.saldo)).split('{vencimento}').join(fmtD(venc)).split('{dias}').join(String(r.dias)).split('{pix}').join(pix).trim();
}

async function registrarCobranca(){
  if(!CTX||CTX.kind!=='cobrar'||!STORE) return;

}
async function registrarContato(id, fon, cobranca){
  const c=S.clientes.get(id); if(!c||!STORE) return;
  const upd={}; if(cobranca) upd.ultimaCobranca=hoje(); if(!c.whatsapp && String(fon||'').replace(/\D/g,'').length>=10) upd.whatsapp=String(fon).trim();
  if(!Object.keys(upd).length) return;
  try{ await mutar(id,c=>({...c,...upd})); }catch(e){ console.warn(e); }
}

/* ============ Lançar produtos falando ============ */
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,três:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12};
const FILL_INI=new Set(['e','mais','depois','próximo','proximo','item','também','tambem','outro','outra','agora']);
const FILL_FIM=new Set(['de','por','a','o','no','na','valor','custa','custando','cada','unidade','unidades','sai','saiu','ficou','foi','é','e','reais','real']);
function parseItens(txt){
  let s=' '+String(txt||'')+' ';
  s=s.replace(/R\$\s*/gi,' ');
  s=s.replace(/(\d+)\s*rea(?:is|l)\s*e\s*(\d{1,2})\s*centavos?/gi,(m,a,b)=>` ${a},${b.padStart(2,'0')} `);
  s=s.replace(/(\d+)\s*(?:reais|real|contos?|pila)\b/gi,' $1 ');
  s=s.replace(/(\d+)\s*centavos?/gi,(m,a)=>` 0,${a.padStart(2,'0')} `);
  s=s.replace(/\b(\d+)\s*[x×]\s/gi,' $1 ').replace(/\s[x×]\s*(\d+)\b/gi,' $1 ');
  s=s.replace(/[\n;]+/g,' | ').replace(/\s[-–—:]\s/g,' ');
  const toks=s.split(/\s+/).filter(Boolean).map(t=>t.replace(/^[,.]+|[,.!?]+$/g,'')).filter(Boolean);
  const isNum=t=>/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(t)||/^\d+([.,]\d{1,2})?$/.test(t);
  const toN=t=>{ if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(t)) return num(t); return parseFloat(t.replace(',','.')); };
  const out=[]; let qtd=null, desc=[];
  const fecha=valor=>{ while(desc.length && FILL_FIM.has(desc[desc.length-1].toLowerCase())) desc.pop(); if(desc.length||valor){ let d=desc.join(' '); d=d.charAt(0).toUpperCase()+d.slice(1); out.push({qtd:qtd||1,desc:d,valor:valor||0}); } qtd=null; desc=[]; };
  for(const t of toks){
    const low=t.toLowerCase();
    if(t==='|'){ if(desc.length) fecha(0); else { qtd=null; } continue; }
    if(isNum(t)){
      const v=toN(t);
      if(qtd===null && !desc.length && Number.isInteger(v) && v>0 && v<=50 && !/[.,]/.test(t)) { qtd=v; continue; }
      if(!desc.length && qtd!==null && Number.isInteger(qtd)){ /* "2 39,90" sem nome */ }
      fecha(v); continue;
    }
    if(qtd===null && !desc.length && NUMW[low]){ qtd=NUMW[low]; continue; }
    if(!desc.length && FILL_INI.has(low)) continue;
    desc.push(t);
  }
  if(desc.length) fecha(0);
  return out.filter(i=>i.desc||i.valor);
}
function previaDitado(txt){
  const its=parseItens(txt); if(!its.length) return `<div class="hint">Os produtos vão aparecendo aqui.</div>`;
  const tot=its.reduce((s,i)=>s+i.qtd*i.valor,0);
  return `<div class="prev-box">${its.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${i.qtd}× ${esc(i.desc||'(sem nome)')}</span><b style="${i.valor?'':'color:var(--late)'}">${i.valor?R(i.qtd*i.valor):'sem valor'}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px"><span class="muted">${its.length} ${plural(its.length,'produto','produtos')}</span><b>${R(tot)}</b></div></div>`;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function pararMic(){ if(REC){ try{ REC.onend=null; REC.stop(); }catch(e){} REC=null; } const b=$('dit-mic'); if(b){ b.textContent='🎤 Começar a falar'; b.classList.add('wa'); b.classList.remove('danger'); } }
function alternarMic(){
  if(REC){ pararMic(); return; }
  try{ REC=new SR(); }catch(e){ toast('O microfone não está disponível aqui. Use o 🎤 do teclado.'); return; }
  REC.lang='pt-BR'; REC.continuous=true; REC.interimResults=true;
  const base=($('dit-txt').value||'').trim(); let fin='';
  REC.onresult=e=>{ let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript+' '; else tmp+=r[0].transcript; }
    const v=(base?base+' ':'')+fin+tmp; const ta=$('dit-txt'); if(ta) ta.value=v; CTX.ditBase=v; const pv=$('dit-prev'); if(pv) pv.innerHTML=previaDitado(v); };
  REC.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Permita o microfone, ou use o 🎤 do teclado.'); pararMic(); };
  REC.onend=()=>{ pararMic(); };
  try{ REC.start(); const b=$('dit-mic'); if(b){ b.textContent='⏹ Parar'; b.classList.remove('wa'); b.classList.add('danger'); } }catch(e){ pararMic(); toast('Não deu para ligar o microfone. Use o 🎤 do teclado.'); }
}

}

/* ============ Histórico, notinha, extrato e envio ============ */
function historicoNota(r,n){
  const inf=r.notaInfo[n.id]; if(!inf) return [];
  const ev=[]; let ord=0;
  ev.push({data:n.data, o:ord++, txt: n.tipo==='saldo' ? `Saldo de notinha antiga lançado: ${R(n.totalOriginal??inf.total)} em ${n.parcOriginal||inf.parcelas.filter(p=>!p.restante).length}x` : `Compra registrada: ${R(n.totalOriginal??inf.total)} em ${n.parcOriginal||inf.parcelas.filter(p=>!p.restante).length}x`});
  for(const h of (n.historico||[])) ev.push({data:h.em, o:ord++, txt:h.txt});
  const porPag=new Map();
  const NL=inf.parcelas.length;
  inf.parcelas.forEach((p,k)=>{ for(const a of p.abates){ const g=porPag.get(a.pagId)||{data:a.data,total:0,parc:[]}; g.total=c2(g.total+a.valor); g.parc.push(nomeParc(p,NL)); porPag.set(a.pagId,g); } });
  for(const tr of (n.transf||[])){ const pg=S.pags.get(tr.pagId); const de=inf.parcelas.find(p=>p.i===tr.de), pa=inf.parcelas.find(p=>p.i===tr.para); ev.push({data:pg?pg.data:hoje(), o:5e5+ord++, txt:`${R(tr.valor)} que faltou da ${de?nomeParc(de,NL):'parcela'} passou para ${pa&&pa.restante?'uma parcela restante':'a '+(pa?nomeParc(pa,NL):'próxima')}`}); }
  for(const [pid,g] of porPag){ const pg=S.pags.get(pid); const val=pg?num(pg.valor):g.total; const forma=pg&&pg.forma?` (${pg.forma})`:'';
    const qual=NL>1?` · ${[...new Set(g.parc)].join(', ')}`:'';
    ev.push({data:g.data, o:ord++, txt: Math.abs(val-g.total)<0.01 ? `Pagamento de ${R(val)}${forma} abatido${qual}` : `Pagamento de ${R(val)}${forma}: ${R(g.total)} abatido aqui${qual}`}); }
  inf.parcelas.forEach((p,k)=>{ if(p.falta<=0.004 && p.abates.length){ const d=p.abates[p.abates.length-1].data; ev.push({data:d,o:1e6+k,txt: p.restante?'Restante pago':(NL>1?`${nomeParc(p,NL)} parcela paga`:'Parcela paga')}); } });
  if(inf.falta<=0.004 && inf.parcelas.some(p=>p.abates.length)){ const d=inf.parcelas.flatMap(p=>p.abates).map(a=>a.data).sort().pop(); ev.push({data:d,o:2e6,txt:'Notinha quitada ✓'}); }
  return ev.sort((a,b)=>(a.data||'').localeCompare(b.data||'')||a.o-b.o);
}
const primeiroNome = c => ((c&&c.nome)||'').trim().split(/\s+/)[0]||'';
function pagamentosDaNota(r,nid){ const inf=r.notaInfo[nid]; if(!inf) return []; const m=new Map();
  for(const p of inf.parcelas) for(const a of p.abates){ const g=m.get(a.pagId)||{data:a.data,abatido:0}; g.abatido=c2(g.abatido+a.valor); m.set(a.pagId,g); }
  return [...m.entries()].map(([pid,g])=>{ const pg=S.pags.get(pid)||{}; const v=num(pg.valor)||g.abatido; return {data:g.data,valor:v,forma:pg.forma||'',abatido:g.abatido,parte:Math.abs(v-g.abatido)>=0.01}; }).sort((a,b)=>a.data.localeCompare(b.data)); }
const valorParcTxt=p=>p.ent>0&&!p.restante?`${R(valorExib(p))} (${R(p.orig)} + ${R(p.ent)} que faltou)`:R(valorExib(p));
function statusParc(p,t){ if(p.falta<=0.004) return ['✅',p.sai>0?`paga (${R(p.sai)} foi para a próxima)`:'paga']; if(p.pago>0) return [p.venc<t?'🔴':'🟡',`pagou ${R(p.pago)}, falta ${R(p.falta)}`]; if(p.venc<t) return ['🔴','vencida']; return ['⏳','a vencer']; }
function textoNota(id){
  const n=S.notas.get(id); if(!n) return ''; const r=linha(n.clienteId); const inf=r.notaInfo[id]; const c=cfg(); const t=hoje();
  const L=[];
  L.push(`*${c.nomeLoja||'Notinha'}*`);
  L.push(`Oi, ${primeiroNome(r.c)}! ${n.tipo==='saldo'?'Segue o que ficou em aberto da sua notinha:':`Segue sua compra de ${fmtD(n.data)}:`}`);
  L.push('');
  for(const it of (n.itens||[])) L.push(`• ${num(it.qtd)||1}x ${it.desc||'item'}: ${R((num(it.qtd)||1)*num(it.valor))}`);
  L.push(`*Total: ${R(inf.total)}*`);
  L.push('');
  if(inf.parcelas.length===1 && inf.parcelas[0].falta<=0.004 && inf.parcelas[0].venc===n.data) L.push('Pago à vista ✅');
  else { L.push(inf.parcelas.length>1?'*Parcelas*':'*Vencimento*'); inf.parcelas.forEach((p,k)=>{ const [e,s]=statusParc(p,t); L.push(`${inf.parcelas.length>1?nomeParc(p,inf.parcelas.length)+' ':''}${fmtD(p.venc)}: ${valorParcTxt(p)}${(p.pago>0||p.venc<t)?` ${e} ${s}`:''}`); }); }
  const pgs=pagamentosDaNota(r,id);
  if(pgs.length){ L.push('', '💰 *Pagamentos*'); for(const g of pgs) L.push(`${fmtD(g.data)}: ${R(g.valor)}${g.forma?' ('+g.forma+')':''}${g.parte?` · ${R(g.abatido)} nesta notinha`:''}`); }
  if(inf.pago>0 && inf.falta>0.004) L.push('', `Já pago: ${R(inf.pago)} · *Falta: ${R(inf.falta)}*`);
  else if(inf.pago>0 && inf.falta<=0.004 && !(inf.parcelas.length===1 && inf.parcelas[0].venc===n.data)) L.push('', '*Notinha quitada* ✅');
  if(c.pix && inf.falta>0.004) L.push('', `Pix: ${c.pix}`);
  L.push('', 'Obrigada pela preferência! 💛');
  return L.join('\n');
}
function textoExtrato(cid){
  const r=linha(cid); const c=cfg(); const t=hoje();
  const abertas=r.notas.filter(n=>r.notaInfo[n.id].falta>0.004);
  const L=[];
  L.push(`*Extrato${c.nomeLoja?' · '+c.nomeLoja:''}*`);
  L.push(`Oi, ${primeiroNome(r.c)}! Aqui está o resumo das suas notinhas, atualizado em ${fmtD(t)}:`);
  if(!abertas.length){ L.push('', 'Você não tem nada em aberto. Tudo pago! ✅'); }
  for(const n of abertas){ const inf=r.notaInfo[n.id];
    L.push('', `🛍️ *${n.tipo==='saldo'?'Notinha anterior':'Compra de '+fmtD(n.data)}*: ${R(inf.total)}`);
    const itens=(n.itens||[]).map(i=>`${num(i.qtd)||1}x ${i.desc}`).filter(x=>x.trim()).join(', '); if(itens && n.tipo!=='saldo') L.push(`   ${itens}`);
    inf.parcelas.forEach((p,k)=>{ const [e,s]=statusParc(p,t); L.push(`   ${inf.parcelas.length>1?nomeParc(p,inf.parcelas.length)+' ':''}${fmtDc(p.venc)}: ${valorParcTxt(p)} ${e} ${s}`); });
  }
  const desde=abertas.length?abertas[0].data:addDias(t,-60);
  const pags=r.pags.filter(p=>p.data>=desde);
  if(pags.length){ L.push('', '💰 *Pagamentos recebidos*'); for(const p of pags) L.push(`   ${fmtDc(p.data)}: ${R(p.valor)}${p.forma?' ('+p.forma+')':''}`); }
  if(abertas.length){
    const tot=abertas.reduce((s,n)=>s+r.notaInfo[n.id].total,0), pago=abertas.reduce((s,n)=>s+r.notaInfo[n.id].pago,0);
    L.push('', `Total das notinhas em aberto: ${R(tot)}`, `Já pago delas: ${R(pago)}`, `*Falta pagar: ${R(r.saldo)}*`);
    if(r.vencido>0) L.push(`Desse valor, ${R(r.vencido)} já venceu.`);
    else if(r.prox) L.push(`Próximo vencimento: ${fmtD(r.prox.venc)} (${R(r.prox.falta)})`);
  }
  if(r.credito>0) L.push(`Você tem ${R(r.credito)} de crédito para a próxima compra.`);
  if(c.pix && r.saldo>0) L.push('', `Pix: ${c.pix}`);
  L.push('', 'Qualquer dúvida é só me chamar 😊');
  return L.join('\n');
}

async function gerarImagem({titulo,B}){
  try{ await document.fonts.ready; }catch(e){}
  const c=cfg(); const W=1080, P=72; const SANS='Inter, -apple-system, Helvetica, Arial, sans-serif', SERIF='Fraunces, Georgia, serif';
  const alt={h:96,row:62,sub:46,sep:34,total:84}; const H=250+B.reduce((s,b)=>s+alt[b.t],0)+(c.pix?150:90);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  const COR={ink:'#2B2420',mut:'#857A70',late:'#B24E26',ok:'#2F7A52',acc:'#2F5D50',line:'#E8DFD4'};
  x.fillStyle='#FBF8F4'; x.fillRect(0,0,W,H);
  x.fillStyle=COR.acc; x.fillRect(0,0,W,200);
  x.fillStyle='#F6F1EA'; x.font=`600 58px ${SERIF}`; x.textBaseline='alphabetic'; x.fillText(titulo,P,112);
  x.font=`500 32px ${SANS}`; x.fillStyle='#CFE2DA'; x.fillText(c.nomeLoja||'Crediário',P,162);
  const corta=(txt,max,font)=>{ x.font=font; if(x.measureText(txt).width<=max) return txt; while(txt.length>1 && x.measureText(txt+'…').width>max) txt=txt.slice(0,-1); return txt+'…'; };
  let y=250;
  for(const b of B){
    if(b.t==='sub'){ x.font=`500 30px ${SANS}`; x.fillStyle=COR.mut; x.fillText(corta(b.txt,W-2*P,x.font),P,y+30); }
    else if(b.t==='sep'){ x.strokeStyle=COR.line; x.lineWidth=2; x.setLineDash([10,8]); x.beginPath(); x.moveTo(P,y+17); x.lineTo(W-P,y+17); x.stroke(); x.setLineDash([]); }
    else if(b.t==='h'){ x.font=`700 26px ${SANS}`; x.fillStyle=COR.acc; x.fillText(corta(b.txt.toUpperCase(),W-2*P,x.font),P,y+70); }
    else if(b.t==='row'||b.t==='total'){
      const big=b.t==='total'; const fr=big?`700 40px ${SERIF}`:`600 32px ${SANS}`; const fl=big?`600 34px ${SANS}`:`400 32px ${SANS}`; const base=y+(big?56:42);
      x.font=fr; x.fillStyle=b.cor?COR[b.cor]:COR.ink; const wr=x.measureText(b.r).width; x.textAlign='right'; x.fillText(b.r,W-P,base); x.textAlign='left';
      let wTag=0; if(b.tag){ x.font=`600 24px ${SANS}`; wTag=x.measureText(b.tag).width+28; }
      x.font=fl; x.fillStyle=big?COR.ink:'#4A403A'; const lt=corta(b.l,W-2*P-wr-wTag-40,fl); x.fillText(lt,P,base);
      if(b.tag){ const lw=x.measureText(lt).width; const tx=P+lw+18; x.font=`600 24px ${SANS}`; const bg=b.cor==='ok'?'#DFF0E6':b.cor==='late'?'#F8E5DA':'#F7EDD2'; x.fillStyle=bg; const tw=wTag-10; x.beginPath(); (x.roundRect?x.roundRect(tx,base-30,tw,40,20):x.rect(tx,base-30,tw,40)); x.fill(); x.fillStyle=b.cor?COR[b.cor]:'#9A6B00'; x.fillText(b.tag,tx+14,base-2); }
    }
    y+=alt[b.t];
  }
  y+=30; x.font=`500 28px ${SANS}`; x.fillStyle=COR.mut;
  if(c.pix){ x.fillStyle=COR.ink; x.font=`600 30px ${SANS}`; x.fillText(corta('Pix: '+c.pix,W-2*P,x.font),P,y+30); y+=60; x.font=`500 26px ${SANS}`; x.fillStyle=COR.mut; }
  x.fillText('Gerado em '+fmtD(hoje()),P,y+30);
  return await new Promise(res=>cv.toBlob(res,'image/png'));
}
async function compartilharImagem(blob,nome){
  if(!blob) return toast('Não deu para gerar a imagem.');
  const f=new File([blob],nome,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f]}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),8000); toast('Imagem salva. Agora é só anexar no WhatsApp.');
}

    case 'salvar-tpl': { if(bloqueado()) return; try{ await D.salvarConfig({...(S.config||{}), bancos:cfg().bancos, tpl:{lembrete:$('tpl-lembrete').value, atrasada:$('tpl-atrasada').value, firme:$('tpl-firme').value}}); toast('Mensagens salvas.'); }catch(err){ falhou(err); } return; }
    case 'reset-tpl': { $('tpl-lembrete').value=DEF_CFG.tpl.lembrete; $('tpl-atrasada').value=DEF_CFG.tpl.atrasada; $('tpl-firme').value=DEF_CFG.tpl.firme; toast('Textos originais de volta. Toque em salvar para manter.'); return; }
    case 'exp-pag': case 'exp-ven': { const txt=exportar(a==='exp-pag'?'pag':'ven',$('exp-mes').value); const ok=await copiar(txt); const o=$('exp-out'); o.value=txt; o.classList.remove('hidden'); if(!ok){ o.focus(); o.select(); toast('Selecione o texto e copie.'); } return; }
  }
});
document.addEventListener('click', e=>{
  if(e.target.closest('#wa-go')) registrarCobranca();
  if(e.target.closest('#e-wa') && CTX && CTX.kind==='envio') registrarContato(CTX.clienteId, CTX.fone, false);
  if(e.target.closest('#f-wa') && CTX && CTX.kind==='fila'){ registrarContato(CTX.ids[CTX.i], CTX.fone, true); CTX.esperando=true; }
});

document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='busca'){ S.busca=el.value; $('lista-cli').innerHTML=listaClientes(); return; }
  if(!CTX) return;
  if(el.id==='pk-in'){ CTX.pkq=el.value; $('pk-res').innerHTML=pickerRes(); return; }
  if(el.dataset.f){ CTX[el.dataset.f]=el.value; if(CTX.kind==='venda'&&el.dataset.f==='primeiro'){} return; }
  if(el.dataset.it){ CTX.itens[+el.dataset.i][el.dataset.it]=el.value; return vendaMudou(); }
  if(el.dataset.pc){ CTX.parcelas[+el.dataset.i][el.dataset.pc]=el.value; CTX.editado=true; $('v-soma').innerHTML=somaHTML(); return; }
  if(el.id==='dit-txt'){ CTX.ditBase=el.value; $('dit-prev').innerHTML=previaDitado(el.value); return; }
  if(el.id==='r-valor'){ CTX.valor=el.value; $('r-prev').innerHTML=previaHTML(); return; }
  if(el.id==='c-msg'){ CTX.msg=el.value; const a=$('wa-go'); if(a) a.href=waLink(); return; }
  if(el.id==='c-fone'){ CTX.fone=el.value; const a=$('wa-go'); if(a) a.href=waLink(); const rt=$('wa-rot'); if(rt) rt.textContent=rotuloWa(CTX.fone,'Abrir conversa no WhatsApp'); return; }
  if(el.id==='e-msg'||el.id==='e-fone'){ if(el.id==='e-msg') CTX.msg=el.value; else CTX.fone=el.value; const a=$('e-wa'); if(a) a.href=waPara(CTX.fone,CTX.msg); const rt=$('wa-rot'); if(rt) rt.textContent=rotuloWa(CTX.fone,'Abrir conversa no WhatsApp'); return; }
  if(el.id==='f-msg'||el.id==='f-fone'){ if(el.id==='f-msg') CTX.msg=el.value; else CTX.fone=el.value; const a=$('f-wa'); if(a) a.href=waPara(CTX.fone,CTX.msg); const rt=$('wa-rot'); if(rt) rt.textContent=rotuloWa(CTX.fone,'Abrir conversa e ir para a próxima'); return; }
});
document.addEventListener('change', e=>{
  const el=e.target; if(!CTX) return;
  if(CTX.kind==='venda' && el.dataset.f==='primeiro' && el.value){ CTX.primeiro=el.value; recalcParcelas(); $('v-parc').innerHTML=parcHTML(); }
  if(CTX.kind==='venda' && el.dataset.f==='data' && el.value && !CTX.notaId && CTX.modo!=='saldo' && !CTX.editado){ CTX.primeiro=addMeses(el.value,1); if(CTX.tipo==='parcelado'){ recalcParcelas(); $('v-parc').innerHTML=parcHTML(); } }
  if(CTX.kind==='receber' && el.dataset.f==='data'){ const pv=$('r-prev'); if(pv) pv.innerHTML=previaHTML(); }
});
function vendaMudou(){
  $('v-total').textContent=R(totalVenda());
  if(CTX.tipo==='parcelado'){ if(!CTX.editado){ recalcParcelas(); $('v-parc').innerHTML=parcHTML(); } else $('v-soma').innerHTML=somaHTML(); }
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['hoje','clientes','conferir','mais'].includes(h) && h!==S.view) irPara(h); });

function msgLogin(x){ const c=x&&x.code||''; if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'E-mail ou senha incorretos.'; if(/too-many-requests/.test(c)) return 'Muitas tentativas. Espere alguns minutos e tente de novo.'; if(/network/.test(c)) return 'Sem internet. Confira a conexão.'; return 'Não deu para entrar. Tente de novo.'; }

/* ============ Exportar ============ */
function exportar(tipo,mes){
  mes=mes||hoje().slice(0,7);
  if(tipo==='pag'){
    const rows=[...S.pags.values()].filter(p=>(p.data||'').startsWith(mes)).sort((a,b)=>a.data.localeCompare(b.data));
    return ['Data\tCliente\tValor\tForma\tBanco\tConferido'].concat(rows.map(p=>[fmtD(p.data),(S.clientes.get(p.clienteId)||{}).nome||'',brNum(p.valor),p.forma||'',p.banco||'',p.conferido?'sim':'não'].join('\t'))).join('\n');
  }
  const rows=[...S.notas.values()].filter(n=>n.tipo!=='saldo'&&(n.data||'').startsWith(mes)).sort((a,b)=>a.data.localeCompare(b.data));
  return ['Data\tCliente\tTotal\tParcelas\tProdutos'].concat(rows.map(n=>[fmtD(n.data),(S.clientes.get(n.clienteId)||{}).nome||'',brNum(n.total),(n.parcelas||[]).length,(n.itens||[]).map(i=>`${i.qtd}x ${i.desc}`).join('; ').replace(/\t/g,' ')].join('\t'))).join('\n');
}

/* ============ Início ============ */
{ const h=location.hash.slice(1); if(['hoje','clientes','conferir','mais'].includes(h)) S.view=h; }
init();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
